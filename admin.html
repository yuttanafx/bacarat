<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>แอดมิน – จัดการสมาชิก</title>
<style>
:root{--bg:#0f1115;--panel:#1a1d24;--panel2:#242832;--fg:#e8e8e8;--muted:#9aa3b2;--line:#2c313c;--green:#2e9e5b;--red:#d9443f;--blue:#2f6fed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans Thai",sans-serif}
main{max-width:980px;margin:0 auto;padding:18px}
h1{margin:0 0 4px}.note{color:var(--muted);font-size:.88rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 4px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:9px 11px}
input,select{width:100%}button{cursor:pointer;font-weight:600;background:var(--blue);border-color:transparent;color:#fff;width:auto}
button.ghost{background:var(--panel2);color:var(--fg);border-color:var(--line)}button.red{background:var(--red)}button.green{background:var(--green)}
button.sm{padding:5px 9px;font-size:.82rem;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}.row>button{flex:0 0 auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.8rem}.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;background:var(--panel2)}
.tag.ok{background:#1d4d33}.tag.off{background:#5a2422}.tag.exp{background:#5a4a1f}
.warn{background:#4a3a14;border:1px solid #8a6d1f;border-radius:8px;padding:10px;margin:10px 0;font-size:.88rem}
#msg{min-height:1.2em;margin-top:8px;font-size:.9rem}.err{color:#ff8a85}.good{color:#7fe0a5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.scroll{overflow-x:visible}
table{table-layout:auto}td:first-child{word-break:break-word}
.sw{position:relative;display:inline-block;width:46px;height:26px;margin:0;vertical-align:middle}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:#5a2422;border-radius:999px;cursor:pointer;transition:.2s}
.sw i::before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--green)}.sw input:checked+i::before{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
tr.more td{background:var(--panel2);border-bottom:1px solid var(--line)}
tr.more[hidden]{display:none}
.chev{display:inline-block;transition:transform .15s}.open .chev{transform:rotate(180deg)}
@media(max-width:640px){.hide-sm{display:none}}
</style></head><body><main>
<div class="top"><div><h1>จัดการสมาชิก</h1><span class="note">เฉพาะแอดมิน · <a href="/" style="color:#8ab4ff">กลับหน้าหลัก</a></span></div>
<div id="who" hidden><span id="whoName" class="note"></span> <button class="ghost sm" id="logout">ออกจากระบบ</button></div></div>

<section class="panel" id="loginBox">
  <h2 style="margin-top:0">เข้าสู่ระบบแอดมิน</h2>
  <div class="grid"><div><label for="lu">ชื่อผู้ใช้</label><input id="lu" autocomplete="username"></div>
  <div><label for="lp">รหัสผ่าน</label><input id="lp" type="password" autocomplete="current-password"></div></div>
  <div class="row" style="margin-top:12px"><button id="lgo">เข้าสู่ระบบ</button></div><div id="lmsg" class="err" style="margin-top:8px"></div>
</section>

<div id="app" hidden>
  <div id="warn" class="warn" hidden>⚠ ยังไม่ได้ต่อ Redis (Upstash) สมาชิกที่สร้างจะหายเมื่อเซิร์ฟเวอร์รีสตาร์ท — ต่อที่ Vercel → Storage → Upstash Redis แล้ว redeploy</div>
  <section class="panel">
    <h2 style="margin-top:0">สร้างสมาชิกใหม่</h2>
    <div class="grid">
      <div><label for="nu">ชื่อผู้ใช้ (a-z 0-9 _ . -)</label><input id="nu" autocomplete="off"></div>
      <div><label for="np">รหัสผ่าน (≥ 6 ตัว)</label><input id="np" type="text" autocomplete="off"></div>
      <div><label for="nn">ชื่อ/ชื่อเรียก</label><input id="nn"></div>
      <div><label for="ne">ใช้งานได้ถึงวันที่ (เว้นว่าง = ไม่จำกัด)</label><input id="ne" type="date"></div>
      <div><label for="nd">หรือกำหนดเป็นจำนวนวัน</label><select id="nd"><option value="">ไม่ใช้ตัวเลือกนี้</option><option value="1">1 วัน</option><option value="7">7 วัน</option><option value="30">30 วัน</option><option value="90">90 วัน</option><option value="180">180 วัน</option><option value="365">1 ปี</option></select></div>
      <div><label for="nt">หมายเหตุ</label><input id="nt"></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="green" id="create">สร้างสมาชิก</button><button class="ghost" id="gen">สุ่มรหัสผ่าน</button></div>
    <div id="msg"></div>
  </section>
  <section class="panel">
    <h2 style="margin-top:0">รายชื่อสมาชิก <span class="note" id="count"></span></h2>
    <div class="row"><div><label for="fq">ค้นหา</label><input id="fq" placeholder="ชื่อผู้ใช้ / ชื่อ / หมายเหตุ"></div>
    <div><label for="fs">สถานะ</label><select id="fs"><option value="">ทั้งหมด</option><option value="active">ใช้งานอยู่</option><option value="disabled">ถูกปิด</option><option value="expired">หมดอายุ</option></select></div>
    <button class="ghost" id="reload">รีเฟรช</button></div>
    <div class="scroll"><table><thead><tr><th>สมาชิก</th><th>เปิดใช้งาน</th><th>ใช้ได้ถึง</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);let T=sessionStorage.getItem("bacc_admin_tok")||"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"}):"-";
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{"Content-Type":"application/json",Authorization:"Bearer "+T,...(opt.headers||{})}});
  const j=await r.json().catch(()=>({ok:false,error:"ตอบกลับไม่ถูกต้อง"}));if(r.status===401&&T){logout();}return j;}
function show(on){$("loginBox").hidden=on;$("app").hidden=!on;$("who").hidden=!on}
function logout(){T="";sessionStorage.removeItem("bacc_admin_tok");show(false)}
$("logout").onclick=logout;
$("lgo").onclick=async()=>{$("lmsg").textContent="";const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("lu").value,password:$("lp").value})});
  const j=await r.json().catch(()=>({}));if(!j.ok){$("lmsg").textContent=j.error||"เข้าสู่ระบบไม่สำเร็จ";return}
  if(j.user.role!=="admin"){$("lmsg").textContent="บัญชีนี้ไม่ใช่แอดมิน";return}
  T=j.token;sessionStorage.setItem("bacc_admin_tok",T);$("whoName").textContent=j.user.username;$("lp").value="";show(true);load()};
$("lp").onkeydown=e=>{if(e.key==="Enter")$("lgo").click()};
let timer;$("fq").oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};$("fs").onchange=load;$("reload").onclick=load;
async function load(){const p=new URLSearchParams({q:$("fq").value,status:$("fs").value});const j=await api("/api/admin?"+p);
  if(!j.ok){return}$("warn").hidden=j.persistent;$("count").textContent=`(${j.total} คน)`;
  const now=Date.now();
  $("tb").innerHTML=j.users.map(u=>{const ex=u.expires&&Date.parse(u.expires)<now,e=esc(u.username),op=OPEN.has(u.username);
    const left=u.expires?fmt(u.expires)+'<div class="note">'+(ex?"หมดแล้ว":"เหลือ "+Math.ceil((Date.parse(u.expires)-now)/864e5)+" วัน")+"</div>":"ไม่จำกัด";
    return `<tr class="${op?"open":""}"><td><b>${e}</b> ${u.name?"· "+esc(u.name):""}<div class="note">${esc(u.note)}${u.note?" · ":""}เข้าล่าสุด ${fmt(u.lastLogin)}</div></td>
    <td><label class="sw" title="${u.active?"ปิดใช้งาน":"เปิดใช้งาน"}"><input type="checkbox" data-a="toggle" data-u="${e}" ${u.active?"checked":""} aria-label="เปิด/ปิดบัญชี ${e}"><i></i></label>${ex?' <span class="tag exp">หมดอายุ</span>':""}</td>
    <td>${left}</td>
    <td><button class="sm ghost" data-a="more" data-u="${e}" aria-expanded="${op}">จัดการ <span class="chev">▾</span></button></td></tr>
    <tr class="more" data-for="${e}" ${op?"":"hidden"}><td colspan="4"><div class="acts">
      <button class="sm ghost" data-a="pw" data-u="${e}">รีเซ็ตรหัสผ่าน</button>
      <button class="sm ghost" data-a="ext" data-u="${e}">ต่ออายุ (กี่วัน)</button>
      <button class="sm ghost" data-a="exp" data-u="${e}">ตั้งวันหมดอายุ</button>
      <button class="sm red" data-a="del" data-u="${e}">ลบสมาชิก</button></div></td></tr>`}).join("")||'<tr><td colspan="4" class="note">ไม่พบสมาชิก</td></tr>'}
const OPEN=new Set();
$("tb").onclick=async e=>{const b=e.target.closest("button,input[data-a=toggle]");if(!b)return;const u=b.dataset.u,a=b.dataset.a;let j;
  if(a==="more"){const r=document.querySelector(`tr.more[data-for="${CSS.escape(u)}"]`);const open=r.hidden;r.hidden=!open;b.setAttribute("aria-expanded",String(open));b.closest("tr").classList.toggle("open",open);open?OPEN.add(u):OPEN.delete(u);return}
  if(a==="toggle"){j=await api("/api/admin",{method:"PATCH",body:JSON.stringify({username:u,active:b.checked})});if(!j.ok)b.checked=!b.checked}
  else if(a==="pw"){const p=prompt("รหัสผ่านใหม่ของ "+u+" (≥ 6 ตัว)");if(!p)return;j=await api("/api/admin",{method:"PATCH",body:JSON.stringify({username:u,password:p})});if(j.ok)alert("เปลี่ยนรหัสผ่านแล้ว")}
  else if(a==="ext"){const n=prompt("ต่ออายุให้ "+u+" อีกกี่วัน (นับจากวันนี้)","30");if(!n)return;j=await api("/api/admin",{method:"PATCH",body:JSON.stringify({username:u,days:Number(n)})})}
  else if(a==="exp"){const d=prompt("วันหมดอายุของ "+u+" (รูปแบบ YYYY-MM-DD, เว้นว่าง = ไม่หมดอายุ)","");if(d===null)return;j=await api("/api/admin",{method:"PATCH",body:JSON.stringify({username:u,expires:d||null})})}
  else if(a==="del"){if(!confirm("ลบสมาชิก "+u+" ?"))return;j=await api("/api/admin?username="+encodeURIComponent(u),{method:"DELETE"})}
  if(j&&!j.ok)alert(j.error||"ไม่สำเร็จ");load()};
$("gen").onclick=()=>{const c="abcdefghjkmnpqrstuvwxyz23456789";const a=new Uint32Array(10);crypto.getRandomValues(a);$("np").value=[...a].map(x=>c[x%c.length]).join("")};
$("create").onclick=async()=>{const m=$("msg");m.className="";m.textContent="";
  const j=await api("/api/admin",{method:"POST",body:JSON.stringify({username:$("nu").value,password:$("np").value,name:$("nn").value,expires:$("ne").value||null,days:$("nd").value||undefined,note:$("nt").value})});
  if(!j.ok){m.className="err";m.textContent=j.error||"สร้างไม่สำเร็จ";return}
  m.className="good";m.textContent=`สร้างแล้ว: ${j.user.username} · ใช้ได้ถึง ${j.user.expires?fmt(j.user.expires):"ไม่จำกัด"} · รหัสผ่าน: ${$("np").value} (จดไว้ให้สมาชิก ระบบไม่แสดงซ้ำ)`;
  ["nu","np","nn","ne","nt","nd"].forEach(i=>$(i).value="");load()};
if(T){api("/api/me").then(j=>{if(j.ok&&j.user.role==="admin"){$("whoName").textContent=j.user.username;show(true);load()}else logout()})}
</script></main></body></html>
